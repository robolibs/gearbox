[package]
name = "gearbox-sim"
description = "gearbox-sim — the USD simulator window. Multi-USD loading, click-to-select, planet world, Mara UI; driven by the `gearbox` CLI."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gearbox-sim"
path = "src/main.rs"

[lib]
name = "gearbox"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:pyo3"]

[dependencies]
bevy.workspace = true

# mara owns the window, ribbons and panes; Bevy renders into its viewport.
mara.workspace = true

# USD asset pipeline + rapier physics + animation playback. These
# are the bevy_openusd workspace's plugins; the gearbox binary just
# wires them together with a minimal world / UI on top.
usd_bevy.workspace = true

openusd-schemas.workspace = true
openusd.workspace = true
serde.workspace = true
serde_json.workspace = true
agentio.workspace = true
peerbus.workspace = true
datapod.workspace = true
gearbox-api = { workspace = true, features = ["bevy"] }

# rapier3d-f64 — needed to spawn the static ground collider directly
# into `usd_bevy::physics::PhysicsWorld`.
rapier3d.workspace = true
bytemuck = "1"
glam = "0.30"
egui.workspace = true
# Move and yaw handles on the selected object while paused.
transform-gizmo = "0.11"
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow = "1"

# Native file picker for the "📂 Load USD…" button.
rfd = "0.15"
png = "0.18"
pyo3 = { version = "0.23", optional = true, features = [
    "abi3-py39",
    "extension-module",
] }
