[package]
name = "gearbox-sim"
description = "gearbox — the USD simulator window and its command-line front door in one binary: no arguments (or `launch`) opens the window, any other argument is a CLI command."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gearbox"
path = "src/main.rs"

[lib]
name = "gearbox"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:pyo3"]
profile = ["bevy/trace", "bevy/debug", "dep:tracing-chrome"]

[dependencies]
bevy.workspace = true
gearbox-controls = { path = "../../crates/gearbox-controls" }
gearbox-fields = { path = "../../crates/gearbox-fields" }
gearbox-globe = { path = "../../crates/gearbox-globe" }
gearbox-planet = { path = "../../crates/gearbox-planet" }
bevy_weather = { path = "../../crates/bevy_weather" }
bevy_biomes = { path = "../../crates/bevy_biomes" }
big_space.workspace = true

# mara owns the window, ribbons and panes; Bevy renders into its viewport.
mara.workspace = true
half = "2.7"

# USD asset pipeline + rapier physics + animation playback. These
# are the bevy_openusd workspace's plugins; the gearbox binary just
# wires them together with a minimal world / UI on top.
usd_bevy.workspace = true

openusd-schemas.workspace = true
openusd.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
agentio.workspace = true
peerbus.workspace = true
datapod.workspace = true
concord.workspace = true
gearbox-api = { workspace = true, features = ["bevy"] }
# CLI dispatch, statically linked in: no arguments (or `launch`) boots the
# sim directly in this same process; anything else goes to `gearbox_cli::run()`.
gearbox-cli.workspace = true

# Rigid-body engines used by the physics backend adapters.
rapier3d = { workspace = true, features = ["enhanced-determinism"] }
molla-core = { git = "https://github.com/bresilla/molla", rev = "2536e2918edd7ead0748d453af3df0d07740d0bf", default-features = false }
molla-math = { git = "https://github.com/bresilla/molla", rev = "2536e2918edd7ead0748d453af3df0d07740d0bf" }
molla-sim = { git = "https://github.com/bresilla/molla", rev = "2536e2918edd7ead0748d453af3df0d07740d0bf", default-features = false }
molla-geometry = { git = "https://github.com/bresilla/molla", rev = "2536e2918edd7ead0748d453af3df0d07740d0bf", default-features = false }
molla-solvers = { git = "https://github.com/bresilla/molla", rev = "2536e2918edd7ead0748d453af3df0d07740d0bf", default-features = false, features = ["gpu"] }
molla-vehicle = { git = "https://github.com/bresilla/molla", rev = "2536e2918edd7ead0748d453af3df0d07740d0bf" }
wgpu = { version = "29", default-features = false, features = ["vulkan", "wgsl"] }
bytemuck = "1"
glam = "0.30"
egui.workspace = true
# Move and yaw handles on the selected object while paused.
transform-gizmo = "0.11"
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-chrome = { version = "0.7", optional = true }
anyhow = "1"

# Native file picker for the "📂 Load USD…" button.
rfd = "0.15"
png = "0.18"
pyo3 = { version = "0.23", optional = true, features = [
    "abi3-py39",
    "extension-module",
] }

[dev-dependencies]
pollster = "0.4"
molla-kernels = { git = "https://github.com/bresilla/molla", rev = "2536e2918edd7ead0748d453af3df0d07740d0bf" }
