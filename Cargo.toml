[workspace]
resolver = "2"
members = [
    "crates/gearbox-api",
    "crates/gearbox-cli",
    "bin/gearbox",
]

# Shared metadata. Each member inherits with `version.workspace = true`.
[workspace.package]
version = "0.0.6"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Local sibling crate — spatial types the whole gearbox stack speaks.
datapod = { git = "https://codeberg.org/robolibs/datapod.git", tag = "0.4.1" }

# Physics backend — f64 variant of rapier3d. Matches datapod's f64
# spatial types, so every boundary crossing stops needing a lossy
# precision downcast.
rapier3d = { version = "0.32", package = "rapier3d-f64" }

# Bevy + ecosystem. Declared once here with their full feature sets so
# every crate that needs Bevy pulls the SAME build (otherwise cargo
# would see distinct feature unions and rebuild bevy twice).
bevy = { version = "0.19", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_state",
    "bevy_log",
    "bevy_window",
    "bevy_winit",
    "bevy_input_focus",
    "bevy_gilrs",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_mesh",
    "bevy_camera",
    "bevy_image",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_picking",
    "bevy_scene",
    "default_font",
    "tonemapping_luts",
    "smaa_luts",
    "ktx2",
    "zstd_rust",
    "png",
    "jpeg",
    "bmp",
    "tga",
    "hdr",
    "webp",
    "tiff",
    "bevy_post_process",
    "morph",
    "x11",
    "wayland",
    "reflect_auto_register",
] }
# peerbus + agentio — the tool API transport. peerbus moves datapod
# payloads between ed25519 ids over shared memory or QUIC; agentio adds
# persistent identity, `did:key`, and the signed topic directory. The
# peerbus rev is the one agentio pins; using its head alone splits
# authbox into two versions.
peerbus = { git = "https://codeberg.org/robolibs/peerbus.git", rev = "f4b31c6155a294a10f5902167afae6f0b78aa528" }
agentio = { git = "https://github.com/robolibs/agentio", rev = "4f422d63ddc17548ec0d0d4f108385d2cfb0e0d7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6"
toml = "1"
libc = "0.2"

gearbox-api     = { path = "crates/gearbox-api", default-features = false }
mara            = { git = "https://github.com/bresilla/mara", branch = "develop", package = "mara", default-features = false, features = ["window", "bevy"] }
egui            = { version = "0.34", default-features = false }
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# bevy_openusd v0.1.0: the live stage editor. openusd is the copy vendored
# and patched inside that repository, so both sides speak the same `Stage`.
usd_bevy        = { git = "https://github.com/bresilla/bevy_openusd", tag = "v0.1.0" }
openusd         = { git = "https://github.com/bresilla/bevy_openusd", tag = "v0.1.0" }
openusd-schemas = { git = "https://github.com/bresilla/bevy_openusd", tag = "v0.1.0", features = ["geom", "shade", "physics"] }

# Local peerbus carries the per-handle request-id seed fix; every crate in
# the graph (agentio included) must see the same peerbus, so patch the
# git source rather than depend on the path directly.
[patch."https://codeberg.org/robolibs/peerbus.git"]
peerbus = { path = "../peerbus" }

# bevy_openusd work in progress (physics markers, incremental projection,
# variant options) comes from the sibling checkout until it is tagged.
# mara 0.4.1 (window host + embedded Bevy viewport) comes from the sibling
# checkout until that branch is pushed.
[patch."https://github.com/bresilla/mara"]
mara = { path = "../../OUSD/mara-bevy-host/mara" }

[patch."https://github.com/bresilla/bevy_openusd"]
usd_bevy        = { path = "../../OUSD/bevy_openusd/crates/usd_bevy" }
openusd         = { path = "../../OUSD/bevy_openusd/vendor/openusd/crates/openusd" }
openusd-schemas = { path = "../../OUSD/bevy_openusd/vendor/openusd/crates/openusd-schemas" }

# bevy_openusd's bevy_asset serialises loads of one source so an older
# snapshot cannot land after a newer one; the patch has to cover the graph.
[patch.crates-io]
bevy_asset = { path = "../../OUSD/bevy_openusd/vendor/bevy_asset" }

# The USD stack projects on the main thread; unoptimised it takes minutes per
# tractor, so those crates get optimised even in dev builds.
[profile.dev.package.usd_bevy]
opt-level = 3
[profile.dev.package.openusd]
opt-level = 3
[profile.dev.package.openusd-schemas]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.zip]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
