[workspace]
resolver = "2"
members = [
    "crates/gearbox-api",
    "crates/gearbox-controls",
    "crates/gearbox-fields",
    "crates/gearbox-globe",
    "crates/gearbox-planet",
    "crates/gearbox-greenhouse",
    "crates/bevy_weather",
    "crates/bevy_biomes",
    "crates/gearbox-cli",
    "bin/gearbox",
    "vendor/bevy_render",
]
# The vendor/molla submodule is its own workspace.
exclude = ["vendor/molla"]

# Shared metadata. Each member inherits with `version.workspace = true`.
[workspace.package]
version = "0.0.6"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Floating origin and nested high-precision grids: the planet frame and the
# sites on it. Upstream's own Bevy 0.19 branch, pinned until it is released.
big_space = { git = "https://github.com/aevyrie/big_space", rev = "5f255228e9b4ff30756347b80f92b19ebf7b5c56", features = ["i64", "bevy_camera"] }
# Local sibling crate — spatial types the whole gearbox stack speaks.
datapod = { git = "https://github.com/robolibs/datapod", tag = "0.6.2" }
# WGS84/ENU geodesy — local sim positions to real lat/lon/alt for GNSS.
concord = { git = "https://github.com/robolibs/concord", tag = "v0.1.6" }

# Bevy + ecosystem. Declared once here with their full feature sets so
# every crate that needs Bevy pulls the SAME build (otherwise cargo
# would see distinct feature unions and rebuild bevy twice).
bevy = { version = "0.19", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_state",
    "bevy_log",
    "bevy_window",
    "bevy_winit",
    "bevy_input_focus",
    "bevy_gilrs",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_mesh",
    "bevy_camera",
    "bevy_image",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_picking",
    "bevy_scene",
    "default_font",
    "tonemapping_luts",
    "smaa_luts",
    "ktx2",
    "zstd_rust",
    "png",
    "jpeg",
    "bmp",
    "tga",
    "hdr",
    "webp",
    "tiff",
    "bevy_post_process",
    "morph",
    "x11",
    "wayland",
    "reflect_auto_register",
    "pbr_light_textures",
] }
# peerbus + agentio — the tool API transport. peerbus moves datapod
# payloads between ed25519 ids over shared memory or QUIC; agentio adds
# persistent identity, `did:key`, and the signed topic directory. The
# peerbus rev is the one agentio pins; using its head alone splits
# authbox into two versions.
peerbus = { git = "https://github.com/robolibs/peerbus", rev = "afbb18c166cb83a82e8c04805b363303d962418f" }
agentio = { git = "https://github.com/robolibs/agentio", rev = "6f0f50113dc3d43fd92d47f6b1c28d1ae79e5b61" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6"
toml = "1"
libc = "0.2"

gearbox-api     = { path = "crates/gearbox-api", default-features = false }
gearbox-cli     = { path = "crates/gearbox-cli" }
mara            = { git = "https://github.com/bresilla/mara", rev = "7ddc9af30b626f245234db5282f1e67fdd70e51f", package = "mara", default-features = false, features = ["window", "bevy"] }
egui            = { version = "0.34", default-features = false }
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# bevy_openusd (develop: v0.3.0 plus texture wraps and mip chains): the live
# stage editor. openusd is the copy vendored and patched inside that
# repository, so both sides speak the same `Stage`.
usd_bevy        = { git = "https://github.com/bresilla/bevy_openusd", rev = "a1916f19458a31c70df815502f0ea319e0fadc2d" }
openusd         = { git = "https://github.com/bresilla/bevy_openusd", rev = "a1916f19458a31c70df815502f0ea319e0fadc2d" }
openusd-schemas = { git = "https://github.com/bresilla/bevy_openusd", rev = "a1916f19458a31c70df815502f0ea319e0fadc2d", features = ["geom", "shade", "physics"] }

# bevy_openusd's bevy_asset serialises loads of one source so an older
# snapshot cannot land after a newer one; the patch has to cover the graph.
[patch.crates-io]
bevy_render = { path = "vendor/bevy_render" }
bevy_asset = { git = "https://github.com/bresilla/bevy_openusd", rev = "a1916f19458a31c70df815502f0ea319e0fadc2d" }
# Vulkan uploads stage in host memory instead of a small BAR heap.
gpu-allocator = { path = "vendor/gpu-allocator" }

# Dependencies are optimised even in dev builds: unoptimised Bevy spends the
# whole frame on the CPU. Our own crates stay at the dev defaults.
[profile.dev.package."*"]
opt-level = 3
# Terrain noise is sampled a million times a square: never unoptimised.
[profile.dev.package.gearbox-globe]
opt-level = 3
[profile.dev.package.usd_bevy]
opt-level = 3
[profile.dev.package.openusd]
opt-level = 3
[profile.dev.package.openusd-schemas]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.zip]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.bevy_mesh]
opt-level = 3
[profile.dev.package.bevy_mikktspace]
opt-level = 3
