[package]
name = "gearbox-api"
description = "Gearbox tool API on agentio: wire types, topics, host and machine agents."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["bevy"]
# Bevy plugin layer — host agent, USD load / marker / reset systems.
bevy = ["dep:bevy", "dep:usd_bevy"]

[dependencies]
datapod.workspace = true
peerbus.workspace = true
agentio.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard = { version = "1.0", default-features = false, features = ["use-std"] }

bevy = { workspace = true, optional = true }
usd_bevy = { workspace = true, optional = true }

